version: 2

# Your pair-build exercises. The models build (so nothing downstream breaks), but the unit
# tests below fail until you write the SQL. They are tagged `exercise`, and CI skips them.
#   make exercises      runs only these tests

models:
  - name: int_attendance_with_age
    config: {tags: [exercise]}
  - name: participants_by_quarter
    config: {tags: [exercise]}

unit_tests:
  - name: ages_use_the_first_of_the_birth_month
    config: {tags: [exercise]}
    model: int_attendance_with_age
    given:
      - input: ref('fct_attendance')
        rows:
          # turns 12 on 1 March 2026
          - {attendance_id: a1, session_date: 2026-03-10, person_id: p_mar2014}
          # the day before turning 12
          - {attendance_id: a2, session_date: 2026-03-31, person_id: p_apr2014}
          # turns 16 on 1 Jan 2026: a band edge
          - {attendance_id: a3, session_date: 2026-01-01, person_id: p_jan2010}
          - {attendance_id: a4, session_date: 2025-12-31, person_id: p_jan2010}
          # date of birth never given
          - {attendance_id: a5, session_date: 2026-02-02, person_id: p_nodob}
          # a visitor: no sign-up at all
          - {attendance_id: a6, session_date: 2026-02-02, person_id: null}
      - input: ref('dim_people')
        rows:
          - {person_id: p_mar2014, dob_month: 2014-03-01}
          - {person_id: p_apr2014, dob_month: 2014-04-01}
          - {person_id: p_jan2010, dob_month: 2010-01-01}
          - {person_id: p_nodob, dob_month: null}
    expect:
      rows:
        - {attendance_id: a1, age_at_session: 12, age_band: 12_to_15}
        - {attendance_id: a2, age_at_session: 11, age_band: under_12}
        - {attendance_id: a3, age_at_session: 16, age_band: 16_plus}
        - {attendance_id: a4, age_at_session: 15, age_band: 12_to_15}
        - {attendance_id: a5, age_at_session: null, age_band: unknown}
        - {attendance_id: a6, age_at_session: null, age_band: unknown}

  - name: participants_are_not_attendances
    config: {tags: [exercise]}
    description: >
      Two sessions in Q1 and one in Q2. Ava comes three times, Ben once, a visitor once,
      and Cal (aged 16) once. Ava turns 16 in Q2 but was 15 at her Q1 sessions.
    model: participants_by_quarter
    given:
      - input: ref('fct_sessions')
        rows:
          - {session_id: s1, session_date: 2026-01-05, programme: Football U16}
          - {session_id: s2, session_date: 2026-02-09, programme: Football U16}
          - {session_id: s3, session_date: 2026-04-06, programme: Football U16}
      - input: ref('int_attendance_with_age')
        rows:
          - {attendance_id: a1, session_id: s1, session_date: 2026-01-05, programme: Football U16, person_id: ava, age_band: 12_to_15}
          - {attendance_id: a2, session_id: s2, session_date: 2026-02-09, programme: Football U16, person_id: ava, age_band: 12_to_15}
          - {attendance_id: a3, session_id: s2, session_date: 2026-02-09, programme: Football U16, person_id: ben, age_band: under_12}
          - {attendance_id: a4, session_id: s2, session_date: 2026-02-09, programme: Football U16, person_id: null, age_band: unknown}
          - {attendance_id: a5, session_id: s3, session_date: 2026-04-06, programme: Football U16, person_id: ava, age_band: 16_plus}
          - {attendance_id: a6, session_id: s3, session_date: 2026-04-06, programme: Football U16, person_id: cal, age_band: 16_plus}
    expect:
      rows:
        - {programme: Football U16, quarter_start: 2026-01-01, sessions_run: 2, attendances: 4, unique_participants: 2, under_16_participants: 2}
        - {programme: Football U16, quarter_start: 2026-04-01, sessions_run: 1, attendances: 2, unique_participants: 2, under_16_participants: 0}
