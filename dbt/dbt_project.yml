name: funderready
version: "0.1.0"
config-version: 2
profile: funderready

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # Which organisation to build, e.g. --vars '{org: leith_community_sports}'.
  # Raw data is read from org_<org>_raw; models are written to org_<org>_<layer>.
  org: leith_community_sports

models:
  funderready:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
