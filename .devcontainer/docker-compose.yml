# Used by GitHub Codespaces / VS Code Dev Containers: a Python workspace plus Postgres.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - ..:/workspaces/funderready:cached
    environment:
      DESTINATION__POSTGRES__CREDENTIALS: postgresql://funderready:funderready@db:5432/funderready
      PGHOST: db
      PGPORT: "5432"
      PGUSER: funderready
      PGPASSWORD: funderready
      PGDATABASE: funderready
      DBT_PROFILES_DIR: .
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: funderready
      POSTGRES_PASSWORD: funderready
      POSTGRES_DB: funderready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funderready -d funderready"]
      interval: 2s
      timeout: 3s
      retries: 30
