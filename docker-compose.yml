services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: funderready
      POSTGRES_PASSWORD: funderready
      POSTGRES_DB: funderready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funderready -d funderready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
